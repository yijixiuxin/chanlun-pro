site_name: Chanlun-PRO 项目
site_author: wangxu
site_description: '基于缠论的市场行情分析工具'
site_url: http://www.chanlun-trader.com

repo_name: 'GitHub'
repo_url: 'https://github.com/yijixiuxin/chanlun-pro'
edit_uri: 'blob/master/cookbook/docs/'

markdown_extensions:
  - toc:
      permalink: True
  - admonition
  - def_list

plugins:
  - search

nav:
  - 功能: features.md
  - 售价与联系方式: pricing-and-contact.md
  - 项目展示: project-showcase.md
  - 更新日志: UPDATE.md
  - FAQ: FAQ.md
  - 安装:
      - 第三方账号依赖: third-party-account-deps.md
      - 服务依赖: service-dependencies.md
      - Windows 安装文档: windows-installation.md
      - Ubuntu 安装文档: ubuntu-installation.md
      - Mac 安装文档: mac-installation.md
      - 配置文件说明: config-file-explained.md
      - 授权方式: licensing.md
      - Web页面功能: web-page-features.md
      - JupyterLab 安装与使用: jupyterlab-guide.md
      - 消息推送支持图片: push-with-images.md
      - 大QMT桥接使用: qmt-bridge.md
  - 缠论配置项说明: chanlun-config-reference.md
  - 缠论买卖点和背驰规则: chanlun-buy-sell-rules.md
  - 缠论数据对象与方法: chanlun-data-objects-methods.md
  - 支持的交易市场: supported-markets.md
  - 历史行情下载: historical-data-download.md
  - 策略回测与实盘:
      - 选股策略: stock-selection-strategy.md
      - 策略编写与运行: strategy-authoring-and-running.md
      - 策略缠论参数优化: strategy-chanlun-optimization.md
      - 实盘: live-trading.md
      - VNPY使用指南: vnpy-guide.md
      - 掘金量化使用: goldminer-guide.md
  - 策略示例:
      - 基于线段的中枢震荡策略: zs-swing-strategy.md
      - 多中枢类型相同买卖点策略: multi-zs-signal-strategy.md
      - 合成自定义K线数据（分钟）: custom-kline-minute.md

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml
    - rust
  include_homepage_in_sidebar: True  # 在侧边栏菜单中列出主页。
  prev_next_buttons_location: both # 设置 “Next” 和 “Previous” 按钮的位置：bottom, top, both , or none
  navigation_depth: 4 # 侧边栏导航标题最大层级，默认4
  collapse_navigation: True # 只在当前页面的侧边栏中包含页面标题。
  titles_only: False # 只在侧边栏中包括文章标题，不包括所有子标题。默认值:False。
  sticky_navigation: True #侧边栏在滚动页面时随主页内容滚动
  locale: zh_CN # 语言配置，需要安装mkdocs[i18n]：pip install mkdocs[i18n]